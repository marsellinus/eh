server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location / {
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"home-api"}\n';
    }

    location /health {
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }
}
