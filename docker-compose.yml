services:
  nginx:
    image: nginx:1.27-alpine
    container_name: target-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
      - ./logs/blocked_ips.txt:/etc/nginx/blocked_ips.txt
    networks:
      home_net:
        ipv4_address: 172.28.0.10
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  ssh-target:
    build:
      context: ./ssh-target
    container_name: target-ssh
    ports:
      - "2222:22"
    volumes:
      - ./logs/ssh:/var/log
    networks:
      home_net:
        ipv4_address: 172.28.0.11
    restart: unless-stopped
    cap_add:
      - NET_ADMIN

  flask-api:
    build:
      context: ./flask-api
    container_name: target-flask
    profiles:
      - api
    ports:
      - "5000:80"
    volumes:
      - ./logs/flask:/var/log/nginx
    networks:
      home_net:
        ipv4_address: 172.28.0.12
    restart: unless-stopped

  dashboard:
    build:
      context: ./monitoring/dashboard
    container_name: sec-dashboard
    profiles:
      - dashboard
    ports:
      - "5050:5050"
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DASHBOARD_ROOT=/workspace
      - TZ=Asia/Jakarta
    restart: unless-stopped

networks:
  home_net:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.28.0.0/24
