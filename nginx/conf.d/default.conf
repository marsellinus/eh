# blocked_ips.txt di-update oleh script benchmark/parser keamanan.
geo $blocked_ip {
    default 0;
    include /etc/nginx/blocked_ips.txt;
}

server {
    listen 80;
    server_name _;

    if ($blocked_ip) {
        return 403;
    }

    location / {
        return 200 'Home server target is running\n';
        add_header Content-Type text/plain;
    }

    location /health {
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }
}
